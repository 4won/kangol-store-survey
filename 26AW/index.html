<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>상품 반응도 조사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 상단 고정 단계 탭 + 한 화면 한 단계. 상품은 복종 탭 → 세부 복종 소제목으로 그룹화 */
:root{
  --bg:#f3f4f7; --card:#ffffff; --fg:#161b26; --mute:#5d6577; --line:#dde0e8;
  --accent:#2540c8; --accent-fg:#ffffff; --accent-soft:#e6eafb;
  --ok:#17803d; --bad:#b42318; --field:#fbfbfd;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131b; --card:#181c27; --fg:#eceef4; --mute:#9aa2b5; --line:#2b3142;
    --accent:#8197ff; --accent-fg:#0d1330; --accent-soft:#232a4d;
    --ok:#4ade80; --bad:#f87171; --field:#12151f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131b; --card:#181c27; --fg:#eceef4; --mute:#9aa2b5; --line:#2b3142;
  --accent:#8197ff; --accent-fg:#0d1330; --accent-soft:#232a4d;
  --ok:#4ade80; --bad:#f87171; --field:#12151f; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{padding-block:20px 12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
h1{margin:2px 0 4px;font-size:24px;font-weight:900;line-height:1.25;text-wrap:balance}
h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:700}
.sub{color:var(--mute);font-size:13px}
nav.steps{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
nav.steps button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer}
nav.steps button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
nav.steps button.done::before{content:"✓ ";color:var(--ok)}
nav.steps button.on.done::before{color:var(--accent-fg)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
section.pane{display:grid;gap:16px;padding-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.q{display:grid;gap:6px;min-width:0}
.q>.lab{font-weight:500;font-size:14px}
.hint{color:var(--mute);font-size:12.5px;font-weight:400}
.req{color:var(--bad)}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea{min-height:84px;resize:vertical}
select{min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:38px}
.opts button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px;padding:6px 2px;cursor:pointer;display:grid;min-height:50px;align-content:center;justify-items:center}
.rate button b{font-size:17px;font-variant-numeric:tabular-nums}
.rate button small{font-size:10.5px;color:var(--mute)}
.rate button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rate button.on small{color:var(--accent-fg)}
.rate.mini button{min-height:40px}.rate.mini button small{display:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:9px;padding:11px 20px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{font-size:13px;padding:6px 12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:14px;font-weight:500;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.subh{display:flex;align-items:baseline;gap:8px;margin:10px 0 -6px;padding-bottom:6px;border-bottom:2px solid var(--fg)}
.subh span{color:var(--mute);font-size:13px}
.prod{display:grid;grid-template-columns:168px 1fr;gap:14px;align-items:start}
.pimg{aspect-ratio:4/3;width:100%;border-radius:8px;background:#fff;border:1px solid var(--line);color:#8a90a0;display:grid;place-items:center;font-size:12px;overflow:hidden;text-align:center}
.pimg img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.tag.g{background:var(--fg);color:var(--bg)}
.tag.c{background:transparent;border:1px solid var(--line);color:var(--mute);font-weight:500}
.attrs{display:grid;gap:10px;grid-column:1/-1}
.attr{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
.attr span{font-size:13.5px;font-weight:500}
details.more>summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500;padding:4px 0;list-style:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more .inner{display:grid;gap:10px;padding-top:6px}
@media (max-width:480px){.prod{grid-template-columns:132px 1fr}.attr{grid-template-columns:1fr;gap:4px}}
@media (max-width:360px){.prod{grid-template-columns:1fr}}
nav.steps button:disabled{opacity:.45;cursor:not-allowed}
.notice{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--mute);text-align:center;font-size:14px}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:6px}
.comp{display:grid;gap:10px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card)}
.comp header{display:flex;justify-content:space-between;align-items:center}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.sum dt{color:var(--mute)}.sum dd{margin:0;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-weight:500;font-size:14px}
.ok{color:var(--ok);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:14px;z-index:20;max-width:90vw}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;z-index:30;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="ttl"></h1>
    <div class="sub" id="lead"></div>
    <div class="banner" id="testbanner" hidden>테스트 모드입니다. 제출하면 서버로 전송되지 않고 JSON 파일로 저장됩니다.</div>
  </header>
  <div id="root"><div class="notice">불러오는 중...</div></div>
</div>
<input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script>
(function(){
const CFG=window.SURVEY_CONFIG||{};
const CATS=[{k:'가방',n:'가방'},{k:'의류',n:'의류'},{k:'모자',n:'모자'}];
const LAB=['아쉬움','부족','보통','좋음','매우 좋음'];
// 가격 적정선을 받을 주요 복종 / 경쟁브랜드를 받을 구분
const PSUBS={'가방':['토트백','크로스백','백팩'],'의류':['긴소매티셔츠','라운드티셔츠','집업','바지','자켓','후드티셔츠','셔츠','니트'],'모자':['벙거지','야구모자']};
const CGROUPS=['의류','가방'];
const STEPS=['매장 선택','시즌 전반','상품별 평가','가격 적정선','경쟁브랜드','제출'];
const DKEY='store-survey-draft-'+(CFG.season||'');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(n==null||n==='')?'-':Number(n).toLocaleString('ko-KR')+'원';
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)};

let stores=[],P={items:[]};
function blank(){return{store:{},season:{},products:{},prices:{},comps:{},extra:'',sid:uuid()}}
function uuid(){return 'S'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
let st=blank();
try{const d=JSON.parse(localStorage.getItem(DKEY)||'null');if(d&&d.store){st=Object.assign(blank(),d);if(Array.isArray(st.comps))st.comps={}}}catch(e){}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(DKEY,JSON.stringify(st))}catch(e){}},300)}
function getp(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],st)}
function setp(p,v){const ks=p.split('.');let o=st;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}if(v===undefined)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v;save()}
let ui={step:0,cat:'가방',sent:null,busy:false};

/* ---------- widgets ---------- */
function rate(path,mini){const v=getp(path);return `<div class="rate${mini?' mini':''}">`+[1,2,3,4,5].map(i=>`<button type="button" data-r="${esc(path)}" data-v="${i}" class="${v===i?'on':''}"><b>${i}</b><small>${LAB[i-1]}</small></button>`).join('')+`</div>`}
function opts(path,list){const v=getp(path);return `<div class="opts">`+list.map(o=>`<button type="button" data-r="${esc(path)}" data-v="${esc(o)}" class="${v===o?'on':''}">${esc(o)}</button>`).join('')+`</div>`}
function txt(path,ph,type){return `<input type="${type||'text'}" data-p="${esc(path)}" value="${esc(getp(path))}" placeholder="${esc(ph||'')}" ${type==='number'?'inputmode="numeric"':''}>`}
function area(path,ph){return `<textarea data-p="${esc(path)}" placeholder="${esc(ph||'')}">${esc(getp(path))}</textarea>`}
function q(label,body,hint,req){return `<div class="q"><div class="lab">${label}${req?' <span class="req">*</span>':''}${hint?` <span class="hint">${hint}</span>`:''}</div>${body}</div>`}
function select(id,list,val,ph,dis){return `<select id="${id}" ${dis?'disabled':''}><option value="">${ph}</option>${list.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
const uniq=a=>[...new Set(a)];

/* ---------- steps ---------- */
function stepStore(){
  const s=st.store,types=uniq(stores.map(x=>x.type)),groups=s.type?uniq(stores.filter(x=>x.type===s.type).map(x=>x.group)):[],
        names=s.group?stores.filter(x=>x.type===s.type&&x.group===s.group).map(x=>x.name):[];
  return `<h2>매장 선택</h2><div class="card">
${q('① 채널형태',select('sel_type',types,s.type,'선택해 주세요'),'',1)}
${q('② 채널계열',select('sel_group',groups,s.group,s.type?'선택해 주세요':'먼저 채널형태를 선택하세요',!s.type),'',1)}
${q('③ 매장명',select('sel_name',names,s.name,s.group?'선택해 주세요':'먼저 채널계열을 선택하세요',!s.group),'',1)}
${s.name?'':'<div class="sub">매장을 선택해야 다음 단계로 넘어갈 수 있습니다.</div>'}</div>`}
function stepSeason(){return `<h2>시즌 전반에 대한 의견</h2><div class="sub">전년(25AW)을 기준점(3점)으로 평가해주세요.</div><div class="card">
${q('이번 시즌 전체 만족도',rate('season.overall'),'',1)}
${q('상품 구성(복종·스타일 균형)',rate('season.assort',1))}
${q('물량·입고 시기',rate('season.timing',1))}
${q('고객 반응(문의·시착·구매)',rate('season.cust',1))}
${q('잘 된 점',area('season.good','고객 반응이 좋았던 상품, 스타일, 시기 등'))}
${q('아쉬운 점·개선 요청',area('season.bad','부족했던 상품, 물량, 가격, 입고 시기 등'))}
${q('기타 의견',area('season.free'))}</div>`}
function prodCard(p){const b='products.'+p.no;return `<div class="card"><div class="prod">
<div class="pimg">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" data-zoom="${esc(p.img)}">`:'이미지 준비중'}</div>
<div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.no)}</div><div class="meta"><span class="tag">${won(p.price)}</span>${p.grade?`<span class="tag g">${esc(p.grade)}등급</span>`:''}</div><div class="meta">${p.colors.map(c=>`<span class="tag c">${esc(c)}</span>`).join('')}</div></div>
<div class="attrs"><div class="attr"><span>디자인</span>${rate(b+'.design',1)}</div>
<div class="attr"><span>가격</span>${rate(b+'.price',1)}</div>
${txt(b+'.comment','한줄평 (고객 반응, 컬러 의견, 수정 요청 등)')}</div></div></div>`}
function stepProducts(){
  const tabs=CATS.map(c=>{const l=P.items.filter(p=>p.cat===c.k),d=l.filter(p=>{const v=st.products[p.no]||{};return v.design||v.price||v.comment}).length;return `<button type="button" data-cat="${c.k}" class="${ui.cat===c.k?'on':''}">${c.n} <span style="opacity:.75">${d}/${l.length}</span></button>`}).join('');
  const list=P.items.filter(p=>p.cat===ui.cat),subs=uniq(list.map(p=>p.sub));
  return `<h2>상품별 평가</h2><div class="sub">출고된 ${esc(CFG.season)} 상품입니다. 디자인·가격을 1점(아쉬움) ~ 5점(매우 좋음)으로 평가해 주세요. 모르는 상품은 건너뛰어도 됩니다.</div><div class="tabs">${tabs}</div>`+
  subs.map(sb=>{const l=list.filter(p=>p.sub===sb);return `<div class="subh"><h3>${esc(sb)}</h3><span>${l.length}개</span></div>`+l.map(prodCard).join('')}).join('')+
  (list.length?`<div class="nav"><span></span>${CATS.findIndex(c=>c.k===ui.cat)<2?`<button type="button" class="btn pri" data-nextcat="1">다음 복종</button>`:`<button type="button" class="btn pri" data-go="1">다음 단계</button>`}</div>`:'<div class="notice">상품이 없습니다.</div>')}
function curRange(c,s){const l=P.items.filter(p=>p.cat===c&&p.sub===s&&p.price).map(p=>p.price);return l.length?`<span class="hint">현재 판매가 ${won(Math.min(...l))}${Math.min(...l)===Math.max(...l)?'':' ~ '+won(Math.max(...l))}</span>`:''}
function stepPrices(){return `<h2>가격 적정선</h2><div class="sub">주요 복종별로 고객 반응과 경쟁브랜드 가격을 기준으로 어느 선이 적당한지 적어 주세요. 모르는 복종은 건너뛰어도 됩니다.</div>`+CATS.map(c=>`<div class="subh"><h3>${c.n}</h3></div>`+PSUBS[c.k].map(s=>{const b='prices.'+s;return `<div class="card"><div><h3>${esc(s)}</h3>${curRange(c.k,s)}</div>
<div class="row2">${q('적정 가격대 하한 (원)',txt(b+'.min','예: 49000','number'))}${q('적정 가격대 상한 (원)',txt(b+'.max','예: 89000','number'))}</div>
${q('우리 상품 가격 수준',opts(b+'.vsCur',['낮은 편','적정','높은 편']))}
${q('경쟁브랜드 대비',opts(b+'.vsComp',['저렴','비슷','비쌈']))}
${txt(b+'.note','의견 (경쟁브랜드 가격, 고객 반응 등)')}</div>`}).join('')).join('')}
function stepComps(){return `<h2>경쟁브랜드 현황</h2><div class="sub">대표 경쟁브랜드로 생각되는 곳을 의류/가방 각 두 군데씩만 기재해 주세요.</div>`+
CGROUPS.map(g=>`<div class="subh"><h3>${g}</h3></div>`+[0,1].map(i=>{const b='comps.'+g+'.'+i;return `<div class="card"><h3>${g} 경쟁브랜드 ${i+1}</h3>
${q('브랜드명',txt(b+'.brand'))}
<div class="row2">${q('가격대',txt(b+'.range','예: 6~12만원'))}${q('강점',txt(b+'.strength','고객이 선호하는 이유'))}</div>
${q('프로모션·동향',txt(b+'.promo','할인, 신상품, 콜라보 등'))}
${q('고객 반응',txt(b+'.reaction','우리 상품과 비교되는 이야기'))}</div>`}).join('')).join('')+
`<div class="card">${q('경쟁 환경 전반 의견',area('extra','브랜드 외에 본사에 전달할 의견'))}</div>`}
function stepSubmit(){
  if(ui.sent)return `<div class="card"><h2>제출 완료</h2><div class="ok">${esc(ui.sent)} 의견이 제출되었습니다. 감사합니다.</div><div class="sub">수정해서 같은 매장으로 다시 제출하면 가장 최근 응답이 반영됩니다.</div><button type="button" class="btn" data-again="1">내용 수정하기</button></div>`;
  const b=build(),miss=[];if(!st.store.name)miss.push('매장');if(!st.season.overall)miss.push('시즌 전체 만족도');
  const per=CATS.map(c=>`${c.n} ${b.products.filter(x=>x.cat===c.k).length}`).join(' · ');
  return `<h2>제출 전 확인</h2><div class="card sum"><dl>
<dt>매장</dt><dd>${esc(st.store.name||'-')}${st.store.type?` (${esc(st.store.type)} · ${esc(st.store.group)})`:''}</dd>
<dt>시즌 전체 만족도</dt><dd>${st.season.overall?st.season.overall+'점':'-'}</dd>
<dt>평가한 상품</dt><dd>${b.products.length} / ${P.items.length}개 (${per})</dd>
<dt>경쟁브랜드</dt><dd>${b.comps.length}개</dd></dl>
${miss.length?`<div class="err">필수 항목을 입력해 주세요: ${miss.join(', ')}</div>`:''}
<div id="subErr" class="err"></div>
<button type="button" class="btn pri" data-submit="1" ${miss.length||ui.busy?'disabled':''}>${ui.busy?'제출 중...':'제출하기'}</button></div>`}
const RENDER=[stepStore,stepSeason,stepProducts,stepPrices,stepComps,stepSubmit];
function stepDone(i){const s=st;return [!!s.store.name,!!s.season.overall,Object.values(s.products).some(x=>x.design||x.price||x.comment),Object.values(s.prices).some(x=>x.min||x.max||x.vsComp||x.vsCur),CGROUPS.some(g=>Object.values(s.comps[g]||{}).some(c=>c.brand)),!!ui.sent][i]}

function build(){
  const rows=[];P.items.forEach(p=>{const v=st.products[p.no];if(v&&(v.design||v.price||v.comment))rows.push({no:p.no,name:p.name,cat:p.cat,sub:p.sub,price:p.price,grade:p.grade||'',design:v.design||null,price_score:v.price||null,comment:v.comment||''})});
  const prices=[],comps=[];
  CATS.forEach(c=>PSUBS[c.k].forEach(s=>{const v=st.prices[s];if(v&&(v.min||v.max||v.vsCur||v.vsComp||v.note))prices.push({cat:c.k,sub:s,min:v.min||null,max:v.max||null,vsCur:v.vsCur||'',vsComp:v.vsComp||'',note:v.note||''})}));
  CGROUPS.forEach(g=>[0,1].forEach(i=>{const v=(st.comps[g]||{})[i];if(v&&Object.values(v).some(Boolean))comps.push({grp:g,brand:v.brand||'',range:v.range||'',strength:v.strength||'',promo:v.promo||'',reaction:v.reaction||''})}));
  return{sid:st.sid,season:CFG.season,at:new Date().toISOString(),store:st.store,seasonQ:st.season,products:rows,prices:prices,comps:comps,extra:st.extra||'',hp:$('#hp').value}
}

function render(){
  const nav=`<nav class="steps">${STEPS.map((s,i)=>`<button type="button" data-step="${i}" ${i>0&&!st.store.name?'disabled':''} class="${ui.step===i?'on':''} ${stepDone(i)?'done':''}">${s}</button>`).join('')}</nav><div class="bar"><i style="width:${Math.round((ui.step+1)/STEPS.length*100)}%"></i></div>`;
  const nextBtn=ui.step<STEPS.length-1&&ui.step!==2;
  $('#root').innerHTML=nav+`<section class="pane">${RENDER[ui.step]()}<div class="nav"><button type="button" class="btn" data-go="-1" ${ui.step?'':'disabled'}>이전</button>${nextBtn?`<button type="button" class="btn pri" data-go="1" ${st.store.name?'':'disabled'}>다음</button>`:'<span></span>'}</div></section>`;
}
/* ---------- events ---------- */
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p)setp(p,e.target.type==='number'&&e.target.value!==''?Number(e.target.value):e.target.value)});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='sel_type'){st.store={type:v};save();render()}
  if(id==='sel_group'){st.store={type:st.store.type,group:v};save();render()}
  if(id==='sel_name'){st.store.name=v;save();render()}
});
document.addEventListener('click',async e=>{
  const z=e.target.closest('[data-zoom]');if(z){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${esc(z.dataset.zoom)}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.r){const cur=getp(d.r),val=/^\d$/.test(d.v)?+d.v:d.v,nv=cur===val?undefined:val;setp(d.r,nv);b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',nv!==undefined&&x===b));return}
  if(d.step!==undefined){if(+d.step>0&&!st.store.name){toast('매장을 먼저 선택해 주세요');return}ui.step=+d.step;render();scrollTo(0,0);return}
  if(d.go){if(+d.go>0&&!st.store.name){toast('매장을 먼저 선택해 주세요');return}ui.step=Math.max(0,Math.min(STEPS.length-1,ui.step+ +d.go));render();scrollTo(0,0);return}
  if(d.cat){ui.cat=d.cat;render();return}
  if(d.nextcat){ui.cat=CATS[CATS.findIndex(c=>c.k===ui.cat)+1].k;render();scrollTo(0,0);return}
  if(d.again){ui.sent=null;ui.step=0;st.sid=uuid();save();render();return}
  if(d.submit)submit(b);
});

async function submit(b){
  const er=$('#subErr');er.textContent='';ui.busy=true;b.disabled=true;b.textContent='제출 중...';
  const payload=build();
  try{
    if(!CFG.endpoint){
      const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=`survey_${(payload.store.name||'test')}_${payload.sid}.json`;document.body.appendChild(a);a.click();a.remove();
    }else{
      const r=await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'제출 실패');
    }
    ui.sent=payload.store.name;clearTimeout(saveT);try{localStorage.removeItem(DKEY)}catch(x){}
  }catch(x){er.textContent='제출하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. 계속 안 되면 아래 버튼으로 파일을 저장해 담당자에게 보내 주세요.';
    er.insertAdjacentHTML('afterend','<button type="button" class="btn sm" id="bk">응답 파일로 저장</button>');
    $('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,1)],{type:'application/json'}));a.download=`survey_${payload.store.name}_${payload.sid}.json`;document.body.appendChild(a);a.click();a.remove()};
    ui.busy=false;b.disabled=false;b.textContent='제출하기';return}
  ui.busy=false;render();scrollTo(0,0);
}

/* ---------- boot ---------- */
$('#eyebrow').textContent=(CFG.season||'')+' 매장 반응도 조사';
$('#ttl').textContent=CFG.title||'상품 반응도 조사';
$('#lead').textContent=(CFG.deadline?CFG.deadline+' · ':'')+(CFG.lead||'');
if(!CFG.endpoint)$('#testbanner').hidden=false;
Promise.all([fetch('data/stores.json').then(r=>r.json()),fetch('data/products.json').then(r=>r.json())])
 .then(([s,p])=>{stores=s;P=p;if(P.season&&CFG.season&&P.season!==CFG.season)console.warn('시즌 불일치');
   if(st.store.name&&!stores.some(x=>x.name===st.store.name))st.store={};   // 저장된 임시값의 매장이 목록에서 빠진 경우
   render()})
 .catch(()=>{$('#root').innerHTML='<div class="notice">데이터를 불러오지 못했습니다. 새로고침해 주세요.</div>'});
})();
</script>
</body>
</html>
