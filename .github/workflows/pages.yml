name: Deploy survey to GitHub Pages
# 시즌 폴더(26AW, 27SS ...)와 루트 index.html 만 배포합니다. tools/ apps-script/ README 는 배포 안 됨.
on:
  push:
    branches: [main]
    paths: ['[0-9][0-9][AS][WS]/**', 'index.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          for d in [0-9][0-9][AS][WS]; do [ -d "$d" ] && cp -r "$d" _site/; done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
