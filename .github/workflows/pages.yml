name: Deploy survey to GitHub Pages
# 조사 폴더(예: 상품반응도_26AW/) 안의 시즌 폴더(26AW, 27SS ...)와 루트 index.html 만 배포합니다.
# tools/ apps-script/ reports/ README 는 배포되지 않습니다. 접속 주소는 .../kangol-store-survey/26AW/ 로 유지됩니다.
on:
  push:
    branches: [main]
    paths: ['*/[0-9][0-9][AS][WS]/**', 'index.html', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          # 상품반응도_26AW/26AW -> /26AW/ , 매장SKU조사/26AW -> /sku-26AW/
          for d in 상품반응도_*/[0-9][0-9][AS][WS]; do [ -d "$d" ] && cp -r "$d" _site/; done
          for d in 매장SKU조사/[0-9][0-9][AS][WS]; do [ -d "$d" ] && cp -r "$d" "_site/sku-$(basename "$d")"; done
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
