name: Deploy survey to GitHub Pages
# scripts/build_site.mjs 가 각 조사 폴더의 survey.json 을 읽어 설문 페이지·암호화 리포트·포털 목록을 조립합니다.
# 새 조사는 폴더 + survey.json 만 추가하면 포털(루트 주소)에 탭이 생깁니다. 설문 주소(/26AW/, /sku-26AW/)는 그대로 유지됩니다.
on:
  push:
    branches: [main]
    paths: ['*/[0-9][0-9][AS][WS]/**', '*/survey.json', '*/report/**', 'index.html', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: node scripts/build_site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
